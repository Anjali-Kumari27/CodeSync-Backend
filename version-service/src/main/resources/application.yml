server:
    port: 8086

spring:
    application:
        name: version-service

    datasource:
        url: jdbc:mysql://localhost:3306/version_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: root
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update

        show-sql: false

        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect

eureka:
    instance:
        prefer-ip-address: false
        hostname: localhost
        instance-id: ${spring.application.name}:${server.port}

    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/

springdoc:
    api-docs:
        path: /v3/api-docs

    swagger-ui:
        path: /swagger-ui.html

management:
    endpoints:
        web:
            exposure:
                include: health, info

logging:
    level:
        com.codesync.version: DEBUG
