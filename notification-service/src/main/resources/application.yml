server:
    port: 8088

spring:
    application:
        name: notification-service

    datasource:
        url: jdbc:mysql://localhost:3307/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: root
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect

    rabbitmq:
        host: localhost
        port: 5672
        username: guest
        password: guest

    mail:
        host: smtp.gmail.com
        port: 587
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true

    thymeleaf:
        prefix: classpath:/templates/
        suffix: .html
        mode: HTML
        cache: false

eureka:
    instance:
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${server.port}

    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/

springdoc:
    api-docs:
        path: /v3/api-docs

    swagger-ui:
        path: /swagger-ui.html

management:
    endpoints:
        web:
            exposure:
                include: health,info

logging:
    level:
        com.codesync.notification: DEBUG
        org.springframework.amqp: DEBUG
