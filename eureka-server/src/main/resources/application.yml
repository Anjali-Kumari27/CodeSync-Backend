server:
  port: 8761

spring:
  application:
    name: eureka-server
  security:
    user:
      name: root
      password: ${DB_PASSWORD}   # Change in production via env variable SPRING_SECURITY_USER_PASSWORD

eureka:
  instance:
    hostname: localhost
  client:
    # This server does NOT register itself as a client
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    # Reduce eviction interval for faster development feedback
    eviction-interval-timer-in-ms: 5000
    # Disable self-preservation in dev (enable in production)
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
