  # ── Notification DB ────────────────────────────────────────
  notification-db:
    image: mysql:8.2
    container_name: codesync_notification_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: anjali123
      MYSQL_DATABASE: notification_db
    ports:
      - "3313:3306"
    volumes:
      - notification_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-panjali123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ ──────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: codesync_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

# ── Named Volumes ──────────────────────────────────────────
volumes:
  auth_db_data:
  project_db_data:
  file_db_data:
  collab_db_data:
  execution_db_data:
  version_db_data:
  comment_db_data:
  notification_db_data:
