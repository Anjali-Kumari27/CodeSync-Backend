server:
  port: 8085

spring:
  application:
    name: execution-service
  datasource:
    url: jdbc:mysql://localhost:3307/execution_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Code execution timeout (seconds)
app:
  execution:
    timeout-seconds: 60
    max-output-size-kb: 512

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.codesync.execution: DEBUG
